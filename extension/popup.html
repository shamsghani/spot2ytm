<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>spot2ytm</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
    }
    h2 { margin: 0 0 8px; font-size: 16px; color: #38bdf8; }
    p { font-size: 12px; color: #94a3b8; margin: 0 0 14px; line-height: 1.4; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="badge">Direct Browser Sync</div>
  <h2>spot2ytm Migrator</h2>
  <p>Paste a Spotify playlist URL. It uses your active YouTube login session to create and populate the playlist instantly.</p>
  
  <input type="text" id="spotifyUrl" placeholder="https://open.spotify.com/playlist/..." />
  <input type="text" id="playlistName" placeholder="Target Playlist Name (optional)" />
  <button id="syncBtn">Migrate to My YouTube</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
